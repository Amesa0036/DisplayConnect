name: Generate new v3 app34 only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Control files must come from the reviewed commit
        run: |
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test -f control/4-touch-recovery2-inputs.json.gz
          ls control/*overlay-app37.json
      - uses: actions/checkout@v4
        with:
          ref: 23275abcdffee840c1f23d008963fb67e650089d
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-36.1' 'platform-tools' 'cmdline-tools;latest'
      - name: Prepare render output directory
        run: sudo mkdir -p /downloads && sudo chmod 777 /downloads
      - name: Restore exact reviewed sources and test fixtures
        shell: python
        run: |
          from pathlib import Path
          import base64,gzip,json,shutil,hashlib
          files=json.loads(gzip.decompress(Path('control/4-touch-recovery2-inputs.json.gz').read_bytes()))
          ov=sorted(Path('control').glob('*overlay-app37.json'));assert len(ov)==1,ov
          over=json.loads(ov[0].read_text());newt='app/src/test/java/com/example/displayconnect/network/NewV3PolicyTest.kt';newt2='app/src/test/java/com/example/displayconnect/network/OtaTrialLogTest.kt';n3='app/src/main/java/com/example/displayconnect/network/PostUsbBootConfirmation.kt';n4='app/src/test/java/com/example/displayconnect/network/NewV32PolicyTest.kt';n5='app/src/test/java/com/example/displayconnect/network/PostUsbBootConfirmationTest.kt';assert set(over)-set(files)<={newt,newt2,n3,n4,n5} and len(over)==12 and {newt,newt2,n3,n4,n5}<=set(over),sorted(over)
          files.update(over)
          for path,value in files.items():
           if path.startswith('__fixtures/'): out=Path('fixtures')/path.removeprefix('__fixtures/')
           elif path.startswith('__ci/'): out=Path('control/ci')/path.removeprefix('__ci/')
           else: out=Path('candidate')/path
           out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(base64.b64decode(value))
          Path('/downloads').mkdir(exist_ok=True)
          assert hashlib.sha256(Path('fixtures/touch-signed.bin').read_bytes()).hexdigest()=='c09e62756318d7db3c402a9966b49efb137f4261bb06aa0e8e089c02b03fbe1a'
          assert hashlib.sha256(Path('fixtures/pmu-return.bin').read_bytes()).hexdigest()=='19e69b42ae969f3e4e9f981de173ddd4dd62f2c2e8eaf59ad475c3edd7069086'
          assert not Path('candidate/app/src/debug').exists()
          Path('control/ci/source-hashes.json').write_text(json.dumps({p:hashlib.sha256(base64.b64decode(v)).hexdigest()for p,v in files.items()},indent=2))
      - name: Prefetch official Robolectric runtime with pinned SHA-256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prefetch"
          cat > "$RUNNER_TEMP/prefetch.sh" <<'PREFETCH_EOF'
          # Prefetch ONE official Maven Central artifact (Robolectric native runtime, ~165 MB) with pinned SHA-256,
          # so Gradle does not have to download it from Central when Central throttles (HTTP 429).
          # Source order: Maven Central, then Google's Maven Central mirror. The pinned hash makes the source irrelevant.
          set -euo pipefail
          OUT="${1:?output dir}"; GH="${2:?gradle user home}"
          G=org/robolectric/nativeruntime-dist-compat/1.0.20; B=nativeruntime-dist-compat-1.0.20
          JAR_SHA=f25c88ce3a02c5f88cf2fb474c2e9c220ec5fa7ba3ac3deeef3d6d26d7861385
          POM_SHA=6ed047e73f94de759b41f00a731f3f21a627881561262f74110a59273b238362
          mkdir -p "$OUT/$G" "$GH/init.d"
          fetch() { # name sha
            for base in "${CENTRAL_BASE:-https://repo.maven.apache.org/maven2}" "${MIRROR_BASE:-https://maven-central.storage-download.googleapis.com/maven2}"; do
              for n in 1 2 3; do
                if curl -fsS --retry 3 --retry-all-errors --retry-delay 20 -o "$OUT/$G/$1.part" "$base/$G/$1" \
                   && [ "$(sha256sum "$OUT/$G/$1.part" | cut -d' ' -f1)" = "$2" ]; then mv "$OUT/$G/$1.part" "$OUT/$G/$1"; echo "ok $1 from $base"; return 0; fi
                rm -f "$OUT/$G/$1.part"; sleep $((n*30))
              done
            done
            echo "could not fetch $1 with the pinned hash" >&2; return 1
          }
          fetch $B.pom $POM_SHA
          fetch $B.jar $JAR_SHA
          cat > "$GH/init.d/prefetched.init.gradle.kts" <<'KTS'
          // Consulted first, for this one module only; everything else still comes from the repositories in settings.gradle.kts.
          beforeSettings {
              dependencyResolutionManagement.repositories.maven {
                  name = "prefetchedCentral"
                  url = uri(System.getenv("PREFETCH_REPO") ?: "file:///nonexistent")
                  content { includeModule("org.robolectric", "nativeruntime-dist-compat") }
              }
          }
          KTS
          PREFETCH_EOF
          bash "$RUNNER_TEMP/prefetch.sh" "$RUNNER_TEMP/prefetch/repo" "$HOME/.gradle"
          echo "PREFETCH_REPO=file://$RUNNER_TEMP/prefetch/repo" >> "$GITHUB_ENV"
      - name: Test and build sequentially without installation
        env:
          TOUCH_PAYLOAD: ${{ github.workspace }}/fixtures/touch-unsigned.bin
          TOUCH_SIGNED: ${{ github.workspace }}/fixtures/touch-signed.bin
          PMU_RECOVERY: ${{ github.workspace }}/fixtures/pmu-return.bin
          HUD_PAYLOAD: ${{ github.workspace }}/fixtures/hud-payload.bin
        run: |
          set -euo pipefail
          for kind in candidate; do
            (cd "$kind" && chmod +x gradlew && ./gradlew --no-daemon --no-configuration-cache --max-workers=1 :app:testDebugUnitTest :app:assembleDebug) > "$RUNNER_TEMP/$kind-build.txt" 2>&1 || { tail -n 100 "$RUNNER_TEMP/$kind-build.txt"; exit 1; }
            tail -n 8 "$RUNNER_TEMP/$kind-build.txt"
          done
      - name: Sign and verify APK with fixed existing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: bash control/ci/sign.sh
      - name: Stage audit hashes
        run: |
          cp control/ci/source-hashes.json verified-pair/

      - uses: actions/upload-artifact@v4
        with:
          name: hecate-new-v3-app37
          path: verified-pair/
          if-no-files-found: error
          retention-days: 1
