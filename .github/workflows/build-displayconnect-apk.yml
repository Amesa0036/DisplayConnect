name: Prepare PMU diagnostic candidate26 and rescue27 packages only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 23275abcdffee840c1f23d008963fb67e650089d
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 23275abcdffee840c1f23d008963fb67e650089d
          path: rescue
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-36.1' 'platform-tools' 'cmdline-tools;latest'
      - name: Stage reviewed pinned sources and audit exact manifests
        shell: python
        run: |
          from pathlib import Path
          import base64,gzip,json
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for path,value in files.items():
           p=Path('control')/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(value))
          for path,value in files.items():
           if not path.startswith('.validation/'):
            p=Path('candidate')/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(value))
          exec(Path('control/.validation/pmu-ci/verify.py').read_text())
      - name: Compile and test both production source trees and assemble debug packages
        run: |
          set -euo pipefail
          for kind in candidate rescue; do
            (cd "$kind" && chmod +x gradlew && ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest :app:assembleDebug) > "$RUNNER_TEMP/$kind-validation.txt" 2>&1 || { tail -n 80 "$RUNNER_TEMP/$kind-validation.txt"; exit 1; }
            tail -n 8 "$RUNNER_TEMP/$kind-validation.txt"
          done
      - name: Sign and audit both APKs atomically
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: bash control/.validation/pmu-packages/sign.sh
      - name: Publish verified APK pair only
        uses: actions/upload-artifact@v4
        with:
          name: hecate-pmu-candidate26-rescue27
          path: verified-pair/
          if-no-files-found: error
          retention-days: 1
      - name: Summarize local validation only
        if: always()
        run: python3 control/.validation/pmu-ci/summarize.py
