name: Hecate Android validation only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hecate-android-validation-review
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/hecate-android-validation-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check approved baseline
        run: |
          git fetch --no-tags origin 85a63d3aa61c3411d5663bb1e4ca679310949aca
          git merge-base --is-ancestor 85a63d3aa61c3411d5663bb1e4ca679310949aca HEAD
          test "$(git diff --name-only 85a63d3aa61c3411d5663bb1e4ca679310949aca HEAD | wc -l)" = 8
          test "$(git diff --name-only 85a63d3aa61c3411d5663bb1e4ca679310949aca HEAD | grep -vE '^([.]validation/hecate/|[.]github/workflows/build-displayconnect-apk[.]yml$)' | wc -l)" = 0
          sha256sum -c <<'APPROVED_HASHES'
          fcf5939ee94fde346652684b4d2f9cb12bbc3e5e5880b016d23dfb382d835329  .validation/hecate/run.sh
          99572298864c3215ac93ca4a2015024a4a63ee4f6cab54111cad4ad3f868a726  .validation/hecate/payload/position.patch
          04e45734f85895a6ed6f7c9e7b112325205edd62481b361649bb3cbb4af5c5c1  .validation/hecate/payload/ota.patch
          274b311581b9e1f38bfdafb6c9bc4475fb5b105eec8e2e3a63783ec383b94efe  .validation/hecate/overlay/app/src/androidTest/java/com/example/displayconnect/PositionValidationTest.kt
          4266ddcbb3fcb36755d3cb9031ce01447599747cb678d9fa5b826e7b39d13f25  .validation/hecate/overlay/app/src/androidTest/java/com/example/displayconnect/OtaValidationTest.kt
          982e4e109f44ff0ab5650fa909a37684612d4ae7eac80827ea156d49e3429228  .validation/hecate/overlay/app/src/debug/AndroidManifest.xml
          e0d65dca692ab93e25f316831b9e42f7f217b9e91b4adc1cb68e5b5aa6336cb0  .validation/hecate/overlay/app/src/debug/java/com/example/displayconnect/ValidationActivity.kt
          APPROVED_HASHES
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-36.1' 'platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash .validation/hecate/run.sh
      - name: Check evidence size
        id: evidence
        if: always()
        run: |
          mkdir -p validation-evidence
          test "$(du -sb validation-evidence | cut -f1)" -le 10485760
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.safe == 'true'
        with:
          name: hecate-android-validation-evidence
          path: validation-evidence/
          retention-days: 1
          if-no-files-found: error
