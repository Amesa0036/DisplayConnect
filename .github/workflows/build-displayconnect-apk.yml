name: Verify Hecate channels UI only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-36.1' 'platform-tools'
      - run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          script: |
            mkdir -p ui-evidence
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.displayconnect.FirmwareChannelsUiTest
            adb pull /sdcard/Android/data/com.example.displayconnect/files/hecate-trial-confirm.png ui-evidence/
            test -s ui-evidence/hecate-trial-confirm.png
      - name: Retain UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hecate-channels-review
          path: |
            ui-evidence/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
          if-no-files-found: error
