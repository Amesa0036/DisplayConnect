name: Rutapalagos ordered UI check (fixed signature, no release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: 82e815ddea89f1295d50e24410c3caa7f8a46b6e49fa767a5ad7795806551645
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore reviewed ordered-UI app-only source overlay
        shell: bash
        run: |
          python3 - <<'PYOVERLAY'
          import base64,json,hashlib,gzip
          from pathlib import Path
          data=json.loads(gzip.decompress(base64.b64decode('')))
          for name,encoded in data['files'].items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name == 'app/build.gradle.kts' or name.startswith('app/src/')
              content=base64.b64decode(encoded) if name in data['binary'] else encoded.encode()
              assert hashlib.sha256(content).hexdigest() == data['sha256'][name]
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(content)
          print('Restored app-only overlay:',len(data['files']),'files')
          PYOVERLAY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore and verify private signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo 'Missing DEBUG_KEYSTORE_BASE64. Build stopped.' >&2
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/displayconnect-signing/debug.keystore"
          mkdir -p "$(dirname "$KEY")"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEY"
          test -s "$KEY"
          keytool -exportcert -keystore "$KEY" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/displayconnect-cert.der"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/displayconnect-cert.der" | cut -d ' ' -f 1)
          echo "Restored public certificate SHA256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo 'Secret certificate does not match the expected local certificate. No APK will be uploaded.' >&2
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 36.1 platform
        run: sdkmanager 'platforms;android-36.1' 'platform-tools'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          echo "HOME=$HOME"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-unset}"
          echo "ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-unset}"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-unset}"
          echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-unset}"
          ./gradlew --no-daemon :app:signingReport :app:testDebugUnitTest :app:assembleDebug

      - name: Enable KVM for UI test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render actual settings in Android emulator (bench UI verification)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          script: |
            mkdir -p ui-evidence
            trap 'for image in /data/local/tmp/settings-passive-info.png /data/local/tmp/settings-passive-buttons.png /data/local/tmp/ui-home.png /data/local/tmp/ui-data-top.png /data/local/tmp/ui-data.png /data/local/tmp/ui-board.png /data/local/tmp/ui-board-before-scroll.png /data/local/tmp/ui-sensors.png /data/local/tmp/ui-extras.png /data/local/tmp/ui-preferences.png /data/local/tmp/ui-advanced.png /data/local/tmp/ui-routes.png /data/local/tmp/ui-last-screen.png; do adb pull "$image" ui-evidence/ || true; done' EXIT; ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.displayconnect.SettingsCaptureUiTest,com.example.displayconnect.DataOrganizationUiTest

      - name: Retain UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diagnostics
          path: |
            ui-evidence/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7

      - name: Sign final APK explicitly and enforce certificate match
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          APK=app/build/outputs/apk/debug/app-debug.apk
          KEY="$RUNNER_TEMP/displayconnect-signing/debug.keystore"
          # Replace Gradle's debug signature with the exact restored private key.
          "$APKSIGNER" sign --ks "$KEY" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/displayconnect-fixed.apk" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/displayconnect-fixed.apk" | tee "$RUNNER_TEMP/displayconnect-signer.txt"
          python3 - <<'PYVERIFY'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'displayconnect-signer.txt').read_text()
          hashes = re.findall(r'^.*certificate SHA-256 digest:\s*([0-9a-fA-F]{64})\s*$', text, re.M)
          expected = os.environ['EXPECTED_CERT_SHA256'].lower()
          if len(hashes) != 1 or hashes[0].lower() != expected:
              raise SystemExit('Final APK signer mismatch. Upload blocked.')
          print('Final APK signature matches the fixed local certificate.')
          PYVERIFY
          mv "$RUNNER_TEMP/displayconnect-fixed.apk" "$APK"

      - name: Retain exact reconstructed app source
        run: tar -czf app-source-ui-prep1.tar.gz app/src app/build.gradle.kts .github/workflows/build-displayconnect-apk.yml

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: displayconnect-mapa-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-source-ui-prep1.tar.gz
            ui-evidence/
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/androidTest-results/connected/

          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/displayconnect-signing"
          rm -f "$RUNNER_TEMP/displayconnect-cert.der" "$RUNNER_TEMP/displayconnect-signer.txt" "$RUNNER_TEMP/displayconnect-fixed.apk"
